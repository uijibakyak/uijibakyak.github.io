<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의지박약 | uijibakyak</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --border: #e5e5e5;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --border: #2c2f35;
        --accent: #7aa2f7;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 48px 0 24px;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    nav {
      margin-top: 20px;
      display: flex;
      gap: 16px;
      font-size: 14px;
    }
    nav a { color: var(--accent); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { padding: 32px 0 64px; }
    article {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }
    article:last-child { border-bottom: none; }
    article h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    article h2 a { color: var(--fg); text-decoration: none; }
    article h2 a:hover { color: var(--accent); }
    time {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    article p { margin: 0; color: var(--muted); font-size: 15px; }
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0 48px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>의지박약</h1>
      <p>작심삼일도 백 번 하면 일 년이 됩니다.</p>
      <nav>
        <a href="./">홈</a>
        <a href="https://github.com/uijibakyak">GitHub</a>
      </nav>
    </header>

    <main>
      <article>
        <h2><a href="#">첫 번째 테스트 글</a></h2>
        <time datetime="2026-09-17">2026년 9월 17일</time>
        <p>깃허브 페이지가 정상적으로 배포되는지 확인하기 위한 테스트 글입니다.
           이 페이지가 보인다면 배포가 성공한 것입니다.</p>
      </article>

      <article>
        <h2><a href="#">두 번째 테스트 글</a></h2>
        <time datetime="2026-09-17">2026년 9월 17일</time>
        <p>글 목록이 어떻게 쌓이는지 확인하기 위한 두 번째 항목입니다.</p>
      </article>
    </main>

    <footer>
      © 2026 uijibakyak
    </footer>
  </div>
</body>
</html>
