<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의지박약</title>
<meta name="description" content="uijibakyak에서 만든 것들의 목차">
<link rel="icon" type="image/png" href="./img/icon-64.png">
<link rel="apple-touch-icon" href="./img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #FAFAF8;
    --fg: #111110;
    --sub: #7B7975;
    --dim: #5C5A55;
    --line: #DCD8D0;
    --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0B;
      --fg: #F7F6F2;
      --sub: #787774;
      --dim: #8F8E8B;
      --line: #2B2B29;
      --card: #141413;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont,
                 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(48px, 12vw, 120px) clamp(20px, 5vw, 32px);
  }

  header { margin-bottom: clamp(40px, 8vw, 72px); }

  .profile {
    display: block;
    width: clamp(80px, 20vw, 112px);
    height: auto;
    margin: 0 0 22px;
    border-radius: 2px;
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .tagline {
    margin: 0;
    font-size: 15px;
    color: var(--sub);
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: var(--dim);
    margin-bottom: 18px;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .entry {
    display: block;
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    text-decoration: none;
    color: inherit;
  }
  .entry:hover { border-color: var(--fg); }
  .entry:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }

  .entry-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .entry-name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .entry-meta {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .entry-desc {
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--sub);
  }

  footer {
    margin-top: clamp(48px, 10vw, 96px);
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--dim);
  }
  footer a { color: var(--dim); }

  /* 배포 확인용. 값은 document.lastModified 라서 따로 올릴 버전 숫자가 없다 */
  .build {
    position: fixed;
    right: clamp(16px, 3vw, 32px);
    bottom: clamp(16px, 3vw, 32px);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .build[hidden] { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="profile" src="./img/profile-256.png" width="256" height="256" alt="">
      <h1>의지박약</h1>
      <p class="tagline">작심삼일도 백 번 하면 일 년이 됩니다.</p>
    </header>

    <main>
      <div class="section-label" id="services">서비스</div>
      <ul aria-labelledby="services">
        <li>
          <a class="entry" href="./clock.html">
            <div class="entry-head">
              <span class="entry-name">시계</span>
              <span class="entry-meta">2026.09</span>
            </div>
            <p class="entry-desc">다크 · 화이트 테마와 밀리초 단위 표시를 지원하는 디지털 시계.</p>
          </a>
        </li>
      </ul>
    </main>

    <footer>
      © 2026 uijibakyak · <a href="https://github.com/uijibakyak">GitHub</a>
    </footer>
  </div>

  <div class="build" id="build" hidden></div>

<script>
(function () {
  'use strict';
  var d = new Date(document.lastModified);
  if (isNaN(d.getTime())) return;
  var p = function (n) { return String(n).padStart(2, '0'); };
  var el = document.getElementById('build');
  el.textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                   ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  el.hidden = false;
})();
</script>
</body>
</html>
